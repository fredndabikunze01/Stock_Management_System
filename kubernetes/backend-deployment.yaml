apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: stock-management
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/component: application
    app.kubernetes.io/part-of: stock-management
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/component: application
        app.kubernetes.io/part-of: stock-management
    spec:
      containers:
        - name: backend
          image: fredndabikunze01/stock-management-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-service:5432/stock_management
            - name: SPRING_DATASOURCE_USERNAME
              value: stock_user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SPRING_JPA_HIBERNATE_DDL_AUTO
              value: update
            - name: LOW_STOCK_THRESHOLD
              value: "10"
            - name: CORS_ALLOWED_ORIGINS
              value: http://localhost:3000,http://localhost:5173
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
